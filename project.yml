name: AGPlugFinder
options:
  bundleIdPrefix: com.adigoldstein
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.24"
    CURRENT_PROJECT_VERSION: "9024"
    DEVELOPMENT_TEAM: 4HJV6RPCLU
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  AGPlugFinder:
    type: application
    platform: macOS
    sources:
      - path: AGPlugFinder
      - path: Bundled/LogicScreenshots
        type: folder
        buildPhase: resources
      - path: Bundled/Share
        type: folder
        buildPhase: resources
    entitlements:
      path: AGPlugFinder/AGPlugFinder.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.cs.allow-unsigned-executable-memory: true
    info:
      path: AGPlugFinder/Info.plist
      properties:
        CFBundleDisplayName: AG PlugFinder
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleName: AG PlugFinder
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "15.0"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        CFBundleAllowMixedLocalizations: false
        NSHumanReadableCopyright: "© 2026 Adi Goldstein"
        AGPFPluginPackURL: "https://github.com/adigold/AG-PlugFinder/releases/latest/download/plugin-pack.zip"
        AGPFPlugDBURL: "https://br-late-rain-b52anezk-plugdb.compute.c-7.us-east-2.aws.neon.tech/"
        AGPFUploadKey: "$(AGPF_UPLOAD_KEY)"
        AGPFUpdateFeedURL: "https://github.com/adigold/AG-PlugFinder/releases/latest/download/update.json"
        NSAccessibilityUsageDescription: "AG PlugFinder places the plugin you pick into an empty insert slot in Logic Pro."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adigoldstein.AGPlugFinder
        PRODUCT_NAME: AG PlugFinder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
